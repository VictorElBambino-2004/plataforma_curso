default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  username: postgres
  password: pstg
  host: localhost
  port: 5432

development:
  <<: *default
  database: plataforma_cursos_development

test:
  <<: *default
  database: plataforma_cursos_test

production:
  primary: &primary_production
    <<: *default
    database: plataforma_cursos_production
    username: plataforma_cursos
    password: <%= ENV["PLATAFORMA_CURSOS_DATABASE_PASSWORD"] %>
  cache:
    <<: *primary_production
    database: plataforma_cursos_production_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    database: plataforma_cursos_production_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_production
    database: plataforma_cursos_production_cable
    migrations_paths: db/cable_migrate